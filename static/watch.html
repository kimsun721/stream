<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #0f1113;
    color: #e7e9eb;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: grid;
    gap: 14px;
  }

  form { display: flex; gap: 8px; }

  input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    background: #181b1e;
    border: 1px solid #2b3035;
    border-radius: 6px;
    color: inherit;
    font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  form button {
    padding: 8px 14px;
    background: #181b1e;
    border: 1px solid #2b3035;
    border-radius: 6px;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  form button:hover { border-color: #8d959c; }
  input:focus-visible, form button:focus-visible { outline: 2px solid #5cc2b4; outline-offset: 1px; }

  #hint { margin: 0; color: #8d959c; }
</style>
</head>
<body>
<main>
  <form id="join">
    <input id="room" placeholder="Room id, RM_..." autocomplete="off" spellcheck="false" required>
    <button>Watch</button>
  </form>

  <div id="player"></div>
  <p id="hint">Enter a room id to watch.</p>
</main>

<script type="module">
  // The page is a thin shell over the viewer SDK, which the server serves as
  // one file. A page with a bundler imports @kimsun721/stream-viewer instead.
  import { createPlayer } from "/stream-viewer.js";

  const query = () => new URLSearchParams(location.search);
  let player = null;

  // The address keeps the room and the debug mode, so a reload or a shared link
  // comes back the same.
  function remember(update) {
    const params = query();
    update(params);
    history.replaceState(null, "", params.size ? `?${params}` : location.pathname);
  }

  function watch(room) {
    player?.destroy();
    document.getElementById("hint").hidden = true;
    remember((params) => params.set("room", room));

    player = createPlayer(document.getElementById("player"), {
      room,
      clock: true,
      debug: query().has("debug"),
      onDebugChange: (on) => remember((params) => (on ? params.set("debug", "") : params.delete("debug"))),
    });
  }

  document.getElementById("join").onsubmit = (event) => {
    event.preventDefault();
    watch(document.getElementById("room").value.trim());
  };

  const room = query().get("room");
  if (room) {
    document.getElementById("room").value = room;
    watch(room);
  }
</script>
</body>
</html>
