name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      # The load run and the tests that need ffmpeg are ignored, so this is the
      # unit suite plus every integration suite.
      - run: cargo test

  sdk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run check

      # The server serves this file, so it has to match the sources it was
      # built from.
      - run: git diff --exit-code ../static/stream-viewer.js
