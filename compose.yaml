services:
  stream:
    build: .
    image: stream:latest
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env or the environment}
    ports:
      # /udp is required, or signalling succeeds and no media arrives.
      - "40000:40000/udp"
      - "8443:8443"
      # Room CRUD. Keep it off the internet.
      - "127.0.0.1:8080:8080"
    volumes:
      # Create the files before uncommenting, or Docker makes directories.
      # - ./config.toml:/app/config.toml:ro
      # - ./certs:/app/certs:ro
      []


  # docker compose --profile observability up
  # Needs metrics_port = 9464 in config.toml, and the config volume above.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Lets it reach a load run's server on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
