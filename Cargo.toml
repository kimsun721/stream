[package]
name = "stream"
version = "0.1.0"
edition = "2024"
description = "A WebRTC SFU for live streaming, with simulcast, WHIP and viewer to viewer relay"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kimsun721/stream"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
str0m = "0.23.0"
systemstat = "0.2.6"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
dotenvy = "0.15.7"
subtle = "2.6.1"
rand = "0.9"
sha2 = "0.11.0"
toml = "1.1.5"
prometheus-client = "0.25"

[dev-dependencies]
libc = "0.2"
reqwest = { version = "0.13.5", features = ["json"] }
